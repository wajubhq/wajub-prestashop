<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect with Wajub again</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;">
<!--
  Wajub for PrestaShop

  @author    Wajub
  @copyright Since 2026 Wajub
  @license   https://opensource.org/licenses/MIT MIT License
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:6px;">
        <tr>
          <td style="padding:24px 24px 8px;">
            <a href="{shop_url}" style="text-decoration:none;"><img src="{shop_logo}" alt="{shop_name}" style="max-width:200px;height:auto;border:0;"></a>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 24px 24px;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.55;color:#363a41;">
            <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#363a41;">Connect with Wajub again</h1>
            <p style="margin:0 0 16px;">{message_html}</p>
            <p style="margin:0 0 16px;">{where_html}</p>
            <p style="margin:0;color:#5b6b73;">{advice_html}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
